<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F4C9C">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#F4F7FB}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

</head><body><title>Umuarama Gestão Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>/* Layout: menu lateral azul fixo + área de trabalho branca; no celular, barra superior + gaveta.
   Paleta branco e azul (pedido da gestão), com ajuda didática em cada tela. */
:root {
  --bg: #F4F7FB; --surface: #FFFFFF; --surface-2: #EEF4FC; --line: #DCE5F2; --line-2: #C3D2E8;
  --ink: #0F2A4A; --ink-2: #3F5672; --muted: #687A92;
  --navy: #0F4C9C; --navy-2: #1A5DB4; --on-navy: #FFFFFF; --on-navy-2: #CFE0F7;
  --gold: #2F8CF0; --gold-ink: #1559B8; --gold-soft: #E3EFFD;
  --ok: #1E7A4C; --ok-bg: #E3F4EA; --warn: #A15C00; --warn-bg: #FDF0DC; --crit: #C0281B; --crit-bg: #FCE6E3; --info: #1F5FBF; --info-bg: #E6EFFB;
  --s1: #1F5FBF; --s2: #0E9F8E; --grid: #E6EDF6;
  --shadow: 0 1px 2px rgba(15, 42, 74, .05), 0 6px 18px rgba(15, 76, 156, .06);
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px; --side: 252px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1424; --surface: #111E33; --surface-2: #172842; --line: #22385A; --line-2: #2E4A74;
    --ink: #E8F0FB; --ink-2: #B7C7DD; --muted: #8496B0;
    --navy: #0A2B5C; --navy-2: #123C7A; --on-navy: #FFFFFF; --on-navy-2: #A9C3E6;
    --gold: #5AA9FF; --gold-ink: #8CC4FF; --gold-soft: #16304F;
    --ok: #5FCB91; --ok-bg: #13321F; --warn: #F0AE4E; --warn-bg: #3A2A10; --crit: #F4877B; --crit-bg: #3D1A17; --info: #7FB0F5; --info-bg: #142A4A;
    --s1: #5B8FE8; --s2: #1BA392; --grid: #1E3352;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1424; --surface: #111E33; --surface-2: #172842; --line: #22385A; --line-2: #2E4A74;
  --ink: #E8F0FB; --ink-2: #B7C7DD; --muted: #8496B0;
  --navy: #0A2B5C; --navy-2: #123C7A; --on-navy: #FFFFFF; --on-navy-2: #A9C3E6;
  --gold: #5AA9FF; --gold-ink: #8CC4FF; --gold-soft: #16304F;
  --ok: #5FCB91; --ok-bg: #13321F; --warn: #F0AE4E; --warn-bg: #3A2A10; --crit: #F4877B; --crit-bg: #3D1A17; --info: #7FB0F5; --info-bg: #142A4A;
  --s1: #5B8FE8; --s2: #1BA392; --grid: #1E3352;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num, td.n, .kpi .v { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 26px/1.2 var(--f-display); letter-spacing: -.01em; }
h2 { font: 700 18px/1.3 var(--f-display); }
h3 { font: 600 13px/1.3 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
a { color: var(--info); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side { background: var(--navy); color: var(--on-navy); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255, 255, 255, .16); }
.brand .mark { font: 700 20px/1.15 var(--f-display); }
.brand .mark b { color: var(--on-navy-2); font-weight: 500; }
.brand .sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--on-navy-2); margin-top: 4px; }
.nav { padding: 10px 10px 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav .grp { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--on-navy-2); padding: 14px 10px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--on-navy); cursor: pointer; font-size: 14.5px; }
.nav button:hover { background: var(--navy-2); }
.nav button[aria-current="page"] { background: #FFFFFF; color: var(--navy); font-weight: 600; }
.nav button[aria-current="page"] .ic { color: var(--navy); }
.nav button .ic { width: 18px; text-align: center; color: var(--on-navy-2); flex: none; font-size: 13px; }
.nav button .badge { margin-left: auto; }
.me { padding: 14px 16px; border-top: 1px solid rgba(255, 255, 255, .16); display: flex; gap: 10px; align-items: center; font-size: 13px; }
.me img { width: 30px; height: 30px; border-radius: 50%; }
.me .role { color: var(--on-navy-2); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.topbar { display: none; }
.main { min-width: 0; padding: 26px clamp(16px, 3vw, 36px) 60px; }
.page-head { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.page-head .eyebrow { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 4px; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.banner { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-bg); border-color: transparent; }
.banner.crit { background: var(--crit-bg); border-color: transparent; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; min-height: 36px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
:root[data-theme="dark"] .btn.primary { background: var(--gold); color: #0B2547; border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--gold); color: #0B2547; border-color: var(--gold); } }
.btn.gold { background: var(--gold); color: #0B2547; border-color: var(--gold); }
.btn.ghost { background: none; border-color: transparent; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 9px; min-height: 30px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="month"], input[type="week"], select, textarea {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-height: 38px; width: 100%; min-width: 0; }
input[readonly], .calc-field { background: var(--surface-2); border-style: dashed; color: var(--ink-2); }
textarea { min-height: 70px; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--gold); color: #0B2547; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--gold); color: #0B2547; } }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: thin; }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }
.period { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.period .lab { font-size: 13px; color: var(--ink-2); padding: 0 4px; }
.period input { width: auto; min-height: 34px; }

/* ---------- cards & kpis ---------- */
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.pad0 { padding: 0; overflow: hidden; }
.card > h3 { margin-bottom: 10px; }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.section { margin-top: 26px; }
.section > .card-head { margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
.kpi .k { font-size: 12.5px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
.kpi .v { font: 700 26px/1.15 var(--f-display); color: var(--ink); }
.kpi .v small { font: 400 14px var(--f-body); color: var(--muted); margin-left: 3px; }
.kpi .d { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kpi.st-ok { box-shadow: inset 0 3px 0 var(--ok); }
.kpi.st-warn { box-shadow: inset 0 3px 0 var(--warn); }
.kpi.st-crit { box-shadow: inset 0 3px 0 var(--crit); }
.kpi.nosrc .v { color: var(--muted); font-size: 18px; font-family: var(--f-body); }
.kpi .formula { font: 11.5px/1.3 var(--f-mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); }
.chip-calc { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); background: var(--gold-soft); border-radius: 4px; padding: 0 5px; font-weight: 600; }
.badge { background: var(--crit); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.dept-card { cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px; transition: border-color .15s; }
.dept-card:hover { border-color: var(--gold); }
.dept-card .t { font: 700 20px/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.dept-card .src { font-size: 12px; color: var(--muted); }
.dept-card dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14px; }
.dept-card dt { color: var(--ink-2); }
.dept-card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; background: var(--surface-2); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl th.calc { color: var(--gold-ink); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.calc { background: color-mix(in srgb, var(--gold-soft) 45%, transparent); }
.tbl tr.total td { font-weight: 700; background: var(--surface-2); }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.tbl td .acts { display: flex; gap: 4px; justify-content: flex-end; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl code { font: 12px/1.4 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
.flag { color: var(--warn); font-size: 12px; }
.empty { padding: 34px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font: 700 17px var(--f-display); margin-bottom: 6px; }

/* ---------- charts ---------- */
.chart { position: relative; height: 260px; }
.chart.tall { height: 320px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.heat { border-radius: 6px; padding: 2px 6px; }

/* ---------- alerts ---------- */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 10px 12px; }
.alert.crit { border-left-color: var(--crit); }
.alert.info { border-left-color: var(--info); }
.alert .ico { font-weight: 700; width: 20px; text-align: center; }
.alert.warn .ico { color: var(--warn); } .alert.crit .ico { color: var(--crit); } .alert.info .ico { color: var(--info); }
.alert .t { font-weight: 600; }
.alert .dd { font-size: 13px; color: var(--ink-2); }
.points { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.points ul { margin: 0; padding-left: 18px; font-size: 14px; }
.points li { margin: 3px 0; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 32, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(760px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.modal .body { padding: 18px 20px; overflow-y: auto; }
.modal footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.calc-box { margin-top: 16px; border: 1px dashed var(--gold); border-radius: 10px; padding: 12px; background: color-mix(in srgb, var(--gold-soft) 40%, transparent); }
.calc-box h3 { color: var(--gold-ink); margin-bottom: 8px; }
.calc-box dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 14px; margin: 0; }
.calc-box dt { font-size: 12px; color: var(--ink-2); }
.calc-box dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--navy); color: var(--on-navy); border: 1px solid var(--gold); padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }
input.inline-edit { width: 110px; min-height: 32px; padding: 4px 8px; text-align: right; }
.formula-note { font: 12px/1.4 var(--f-mono); color: var(--muted); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .crit-t { color: var(--crit); }
.skeleton { color: var(--muted); padding: 40px; text-align: center; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-100%); transition: transform .2s; height: 100%; padding-top: env(safe-area-inset-top, 0px); }
  .app.nav-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(10, 16, 32, .45); }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); color: var(--on-navy); align-items: center; gap: 10px; padding: 10px 16px; }
  .topbar .mark { font: 700 17px var(--f-display); }
  .topbar .mark b { color: var(--on-navy-2); font-weight: 500; }
  .topbar button { background: none; border: 1px solid rgba(255, 255, 255, .45); color: var(--on-navy); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .topbar .sp { flex: 1; }
  .main { padding: 18px 16px 70px; }
  h1 { font-size: 23px; }
  .kpi .v { font-size: 24px; }
  /* tabelas de lançamento viram cartões */
  table.cards thead { display: none; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards tr { border-bottom: 1px solid var(--line-2); padding: 8px 4px; }
  table.cards td { border: 0; padding: 3px 10px; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  table.cards td::before { content: attr(data-l); font-size: 12px; color: var(--ink-2); text-align: left; font-weight: 600; flex: none; max-width: 50%; }
  table.cards td.calc { background: none; }
  table.cards td.calc::before { color: var(--gold-ink); }
  table.cards td.acts-cell { justify-content: flex-end; }
  table.cards td.acts-cell::before { content: none; }
  table.cards td:empty { display: none; }
  .tbl-wrap.cards-wrap { overflow: visible; }
  .modal { border-radius: 14px 14px 0 0; align-self: flex-end; max-height: 92%; }
  .overlay { padding: 0; align-items: flex-end; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* navegação por departamento */
@media (min-width: 901px) { .dep-tabs .tabs { display: none; } }
.dept-card.ger { background: var(--navy); color: var(--on-navy); border-color: var(--gold); }
.dept-card.ger .src, .dept-card.ger dt { color: var(--on-navy-2); }
.dept-card.ger .t { color: #FFFFFF; }
.inicio .dept-card { min-height: 190px; }

/* ---------- ajuda didática ---------- */
.card, .kpi, .dept-card { box-shadow: var(--shadow); }
.guia { background: var(--info-bg); border: 1px solid var(--line-2); border-left: 4px solid var(--info); border-radius: var(--r); padding: 0; margin: -6px 0 18px; }
.guia summary { cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--info); list-style: none; display: flex; gap: 8px; align-items: center; }
.guia summary::-webkit-details-marker { display: none; }
.guia summary::before { content: "?"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--info); color: #fff; font-size: 12px; font-weight: 700; flex: none; }
.guia summary::after { content: "mostrar"; margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
.guia[open] summary::after { content: "ocultar"; }

// ---------- alertas ----------
function alertas(p, depFiltro) {
  const out = [];
  const deps = depsVisiveis().filter((d) => !depFiltro || depFiltro === 'Todos' || d === depFiltro);
  const prev = prevPeriod(p); const lim = variacaoLimite();
  for (const dep of deps) {
    // 1) indicador x meta
    for (const k of KPIS.filter((x) => x.dep === dep && aplicavel(x, p))) {
      const a = avaliar(k, p);
      if (a.st === 'warn') out.push({ sev: 'warn', dep, tipo: 'Meta', titulo: `${k.nome} ${a.sentido === 'max' ? 'abaixo da meta' : 'acima do limite'}`, det: `Realizado ${fmt(a.v, k.fmt)} · meta ${fmt(a.meta.valor, k.fmt)} (${a.meta.origem === 'planilha' ? 'meta da planilha' : 'meta configurada'})`, go: { page: 'dep', dep } });
      // 2) variação relevante x período anterior (limite configurável)
      if (lim !== null && a.sentido) {
        const vb = valorCmp(k, prev);
        const vr = variacao(a.v, vb);
        if (isNum(vr.pct) && Math.abs(vr.pct) * 100 >= lim && ((a.sentido === 'max' && vr.abs < 0) || (a.sentido === 'min' && vr.abs > 0)))
          out.push({ sev: 'info', dep, tipo: 'Variação', titulo: `${k.nome}: piora de ${fmt(Math.abs(vr.pct), 'pct')} vs período anterior`, det: `${fmt(a.v, k.fmt)} agora · ${fmt(vb, k.fmt)} em ${prev.label} (limite ${fmt(lim, 'dec1')}%)`, go: { page: 'dep', dep } });
      }
    }
    // 3) regras das próprias planilhas
    if (dep === 'rec') {
      const r = calcRec(p);
      const pend = r.linhas.filter((x) => x.status === 'Pendente');
      if (pend.length) out.push({ sev: 'warn', dep, tipo: 'Status', titulo: `${pend.length} solicitação(ões) com status Pendente`, det: pend.slice(0, 6).map((x) => `UH ${x.uh ?? '—'} (${x.tipo || 's/ tipo'}, ${dBR(x.data)})`).join(' · ') + (pend.length > 6 ? ' …' : ''), go: { page: 'dep', dep, tab: 'controle', comp: pend[0]._comp } });
      const and = r.linhas.filter((x) => x.status === 'Em Andamento');
      if (and.length) out.push({ sev: 'info', dep, tipo: 'Status', titulo: `${and.length} solicitação(ões) Em Andamento`, det: and.slice(0, 6).map((x) => `UH ${x.uh ?? '—'}`).join(' · '), go: { page: 'dep', dep, tab: 'controle', comp: and[0]._comp } });
      const neg = r.linhas.filter((x) => isNum(x.tempo) && x.tempo < 0);
      if (neg.length) out.push({ sev: 'crit', dep, tipo: 'Consistência', titulo: `${neg.length} tempo(s) de atendimento negativo(s)`, det: 'Hora de conclusão menor que a de solicitação: ' + neg.map((x) => `UH ${x.uh} em ${dBR(x.data)} (${fmt(x.tempo, 'dec1')} min)`).join(' · '), go: { page: 'dep', dep, tab: 'controle', comp: neg[0]._comp } });
      const fora = r.linhas.filter((x) => x.data && x.data.slice(0, 7) !== x._comp);
      if (fora.length) out.push({ sev: 'info', dep, tipo: 'Consistência', titulo: `${fora.length} linha(s) com data fora do mês da aba`, det: fora.slice(0, 6).map((x) => `${dBR(x.data)} na aba ${compCurto(x._comp)}`).join(' · '), go: { page: 'dep', dep, tab: 'controle', comp: fora[0]._comp } });
    }
    if (dep === 'gov') {
      const g = calcGov(p);
      const abaixo = {}; g.linhas.filter((x) => x.status === Engine.ABAIXO).forEach((x) => { abaixo[x.camareira || '(sem nome)'] = (abaixo[x.camareira || '(sem nome)'] || 0) + 1; });
      const n = Object.values(abaixo).reduce((a, b) => a + b, 0);
      if (n) out.push({ sev: 'warn', dep, tipo: 'Produtividade', titulo: `${n} lançamento(s) camareira-dia abaixo da meta de ${fmt(g.dash.metaProd, 'dec1')} UHs`, det: Object.entries(abaixo).map(([k, v]) => `${k}: ${v}`).join(' · '), go: { page: 'dep', dep, tab: 'graficos' } });
      if (g.nc.abertas) out.push({ sev: 'warn', dep, tipo: 'Não conformidade', titulo: `${g.nc.abertas} NC aberta(s)`, det: g.ncRows.filter((x) => x.status === 'Aberta').map((x) => `UH ${x.uh} · ${x.tipo || ''}`).join(' · '), go: { page: 'dep', dep, tab: 'nc' } });
      if (g.achados.naoLocalizados) out.push({ sev: 'crit', dep, tipo: 'Achados e Perdidos', titulo: `🔴 ${g.achados.naoLocalizados} item(ns) não localizado(s)`, det: g.achRows.filter((x) => x.status === 'Não localizado').map((x) => `${x.local ?? ''} ${x.descricao || ''} (${dBR(x.data)})`).join(' · '), go: { page: 'dep', dep, tab: 'achados' } });
      if (g.achados.aguardando) out.push({ sev: 'info', dep, tipo: 'Achados e Perdidos', titulo: `${g.achados.aguardando} item(ns) aguardando retirada`, det: '', go: { page: 'dep', dep, tab: 'achados' } });
    }
    if (typeof alertasExt === 'function') alertasExt(dep, p, out);
    if (dep === 'ab') {
      const a = calcAB(p);
      const err = a.linhas.filter((x) => x.descartada === Engine.ERRO_REAPROV);
      if (err.length) out.push({ sev: 'crit', dep, tipo: 'Consistência', titulo: `${err.length} lançamento(s) com "ERRO: reaprov.>sobra"`, det: err.map((x) => `${x.item} em ${dBR(x.data)}`).join(' · '), go: { page: 'dep', dep, tab: 'lanc', comp: err[0]._comp } });
      const semPreco = a.linhas.filter((x) => x.sobra !== null && x.sobra !== undefined && x.sobra !== '' && X.isErr(x.valorSobra));
      if (semPreco.length) out.push({ sev: 'crit', dep, tipo: 'Consistência', titulo: `${semPreco.length} lançamento(s) com erro de valor (item sem preço válido)`, det: semPreco.map((x) => `${x.item} em ${dBR(x.data)}`).join(' · '), go: { page: 'dep', dep, tab: 'itens' } });
    }
  }
  const ord = { crit: 0, warn: 1, info: 2 };
  return out.sort((a, b) => ord[a.sev] - ord[b.sev]);
}

// ---------- tabela de indicadores (usada em painel, diário, mensal) ----------
function kpiRows(p, deps, cols) {
  const prev = prevPeriod(p), yoy = yoyPeriod(p);
  const rows = [];
  for (const dep of deps) for (const k of KPIS.filter((x) => x.dep === dep)) {
    if (!aplicavel(k, p)) continue;
    const a = avaliar(k, p);
    const vb = valorCmp(k, prev), vy = valorCmp(k, yoy);
    rows.push({ dep: DEPS[dep].nome, ind: k.nome, k, a, real: a.v, meta: a.meta ? a.meta.valor : '', desvio: a.desvio, ant: vb, yoy: vy, st: a.st });
  }
  return { colunas: [
    { k: 'dep', t: 'Departamento' }, { k: 'ind', t: 'Indicador', html: (l) => esc(l.ind) + (KPI_AJUDA[l.k.id] ? `<div class="ind-ajuda">${esc(KPI_AJUDA[l.k.id])}</div>` : '') },
    { k: 'real', t: 'Realizado', n: true, html: (l) => esc(fmt(l.real, l.k.fmt)), xf: (l) => l.real },
    { k: 'meta', t: 'Meta', n: true, html: (l) => (l.a.meta ? esc(fmt(l.meta, l.k.fmt)) + (l.a.meta.origem === 'planilha' ? ' <span class="chip-calc" title="meta da planilha">plan.</span>' : '') : '<span class="muted">—</span>') },
    { k: 'desvio', t: 'Desvio', n: true, html: (l) => (isNum(l.desvio) ? esc((l.desvio > 0 ? '+' : '') + fmt(l.desvio, l.k.fmt === 'pct' ? 'pct' : l.k.fmt === 'brl' ? 'brl' : 'dec2')) : '—') },
    ...(cols && cols.ant === false ? [] : [{ k: 'ant', t: `Anterior (${prev.label})`, n: true, html: (l) => `${esc(fmt(l.ant, l.k.fmt))}<br><span class="small">${deltaTxt(l.real, l.ant, l.k.fmt, l.a.sentido)}</span>` }]),
    ...(cols && cols.yoy ? [{ k: 'yoy', t: `Ano anterior (${yoy.label})`, n: true, html: (l) => `${esc(fmt(l.yoy, l.k.fmt))}<br><span class="small">${deltaTxt(l.real, l.yoy, l.k.fmt, l.a.sentido)}</span>` }] : []),
    { k: 'st', t: 'Status', html: (l) => pill(l.st), xf: (l) => ({ ok: 'Na meta', warn: 'Fora da meta', none: 'Sem meta', nosense: 'Meta sem sentido' }[l.st]) },
  ], linhas: rows };
}

function pageMensal() {

  }

const LEGADO_ROT = { horaSol: 'Hora solicitação', horaCon: 'Hora conclusão', tempo: 'Tempo de atendimento', descartada: 'Qtd descartada', unidade: 'Unidade', pNoShow: '% No-show' };
function legadoDiverge(l) {
  if (!l._legado) return [];
  return Object.entries(l._legado).filter(([k, v]) => {
    const c = l[k];
    if (typeof v === 'number' && typeof c === 'number') return Math.abs(v - c) > 1e-9;
    return (v === null ? '' : v) !== (c === null || c === undefined ? '' : c);
  });
}
function legadoFlag(l) {
  const d = legadoDiverge(l); if (!d.length) return '';
  const t = d.map(([k, v]) => `${LEGADO_ROT[k] || k}: na planilha original ${v === null ? 'célula vazia (sem fórmula)' : '"' + v + '"'}; pela fórmula ${fmt(l[k], 'full')}`).join(' · ');
  return ` <span class="flag" title="${esc(t)}" aria-label="${esc(t)}">◆</span>`;
}
function sheetModel(sheet, comp) {

      if (c.tipo === 'time') return esc(hora(v)) + (typeof v === 'string' ? ' <span class="flag">texto</span>' : '');
      if (c.k === 'tempo' && isNum(v) && v < 0) return `<span class="crit-t">${esc(fmt(v, c.fmt))}</span>`;
      if (c.k === 'descartada' && v === Engine.ERRO_REAPROV) return `<span class="crit-t">${esc(v)}</span>`;
      return esc(fmt(v, c.fmt));
    }),
    xf: c.tipo === 'time' ? (l) => hora(l[c.k]) : c.tipo === 'date' ? (l) => dBR(l[c.k]) : c.k === 'status' && sheet === 'gov_uh' ? (l) => (l.status || '').replace(/[✅⚠]\s?/, '') : undefined,
  }));

const temTexto = (v, t) => !X.isBlank(v) && X.eqCI(v, t);
function alertasExt(dep, p, out) {
  if (dep === 'rec') {
    const r = calcRDA(p);
    const pend = r.linhas.filter((x) => temTexto(x.correcao, 'Pendente'));
    if (pend.length) out.push({ sev: 'warn', dep, tipo: 'RDA', titulo: `${pend.length} não conformidade(s) do RDA com correção pendente`, det: pend.slice(0, 6).map((x) => `${x.recepcionista || '—'} · ${x.origem || ''}${x.data ? ' (' + dBR(x.data) + ')' : ''}`).join(' · '), go: { page: 'dep', dep, tab: 'rda', comp: pend[0]._comp } });
    const L = naoVazios(rdaParam().correcao);
    const fora = r.linhas.filter((x) => !X.isBlank(x.correcao) && !L.some((c) => X.eqCI(c, x.correcao)));
    if (fora.length) out.push({ sev: 'info', dep, tipo: 'Consistência', titulo: `${fora.length} linha(s) do RDA com correção fora da lista (${L.join(' / ')})`, det: fora.map((x) => `"${x.correcao}"${x.data ? ' em ' + dBR(x.data) : ''}`).join(' · ') + ' — não contam como corrigidas nem pendentes, como na planilha.', go: { page: 'dep', dep, tab: 'rda', comp: fora[0]._comp } });
  }
  if (dep === 'ab') {
    const c = calcCK(p); const ruins = c.linhas.filter((x) => x.classe === 'Ruim');
    if (ruins.length) out.push({ sev: 'warn', dep, tipo: 'Padrão do café', titulo: `${ruins.length} dia(s) com o padrão do café classificado como Ruim`, det: ruins.map((x) => dBR(x.data)).join(' · '), go: { page: 'dep', dep, tab: 'checklist', comp: ruins[0]._comp } });
  }
  if (dep === 'man') {
    const m = calcMan(p);
    const ini = m.linhas.filter((x) => temTexto(x.status, 'Iniciado'));
    if (ini.length) out.push({ sev: 'warn', dep, tipo: 'Status', titulo: `${ini.length} OS iniciada(s), ainda não concluída(s)`, det: ini.slice(0, 6).map((x) => `${x.servico || 's/ serviço'} · ${x.area || ''} (${dBR(x.data)})`).join(' · '), go: { page: 'dep', dep, tab: 'os', comp: ini[0]._comp } });
    const fora = m.linhas.filter((x) => x.prazo === 'Fora do prazo');
    if (fora.length) out.push({ sev: 'warn', dep, tipo: 'Prazo', titulo: `${fora.length} OS concluída(s) fora do prazo padrão`, det: fora.slice(0, 6).map((x) => `${x.servico} · ${x.area || ''} (${dBR(x.data)})`).join(' · '), go: { page: 'dep', dep, tab: 'os', comp: fora[0]._comp } });
  }
}

function rdaVolumeGrid(comp) {

  return `<div class="section card"><div class="card-head"><h3>Volume diário — check-ins + check-outs (preencha 1× por dia)</h3><span class="small muted">Total do mês: <b>${fmt(volDoMes(comp), 'int')}</b> · base do índice de erros operacionais</span></div><p class="small muted" style="margin-top:0">Tabela separada: 1 linha por dia do mês, preenchida mesmo sem não conformidade nenhuma naquele dia.</p><div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">${cells}</div></div>`;
}

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Não foi possível salvar. Confira a internet e tente de novo.';
  if (c === 'quota_exceeded') return 'Limite de armazenamento atingido. Faça um backup e exclua competências antigas.';
  if (c === 'resource_exhausted') return 'Muitas gravações seguidas. Aguarde alguns segundos e tente de novo.';
  return 'Não foi possível salvar agora. Verifique a conexão e tente novamente.';
}
const vShow = (v) => (v === null || v === undefined || v === '' ? '' : typeof v === 'number' ? String(v) : String(v));

// ---------- auditoria ----------
async function audit(dep, reg, acao, mud) {
  if (!S.db) return;
  const dia = todayISO(); const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const entry = { ts: new Date().toISOString(), u: S.uid, dep, reg, acao, mud: (mud || []).slice(0, 60) };
  const ref = S.db.doc('auditoria/' + dia);
  try { await ref.update({ e: { [id]: entry } }); } catch (e) { try { await ref.set({ dia, e: { [id]: entry } }); } catch (e2) { /* auditoria é best-effort */ } }
}
function diff(antes, depois, cols) {
  const out = [];
  for (const c of cols) { if (c.calc) continue; const a = antes ? antes[c.k] : null, b = depois ? depois[c.k] : null; const sa = c.tipo === 'time' ? hora(a) : vShow(a), sb = c.tipo === 'time' ? hora(b) : vShow(b); if (sa !== sb) out.push({ campo: c.t, antes: sa, depois: sb }); }
  return out;
}
async function writeMerge(path, patch, create) {
  const ref = S.db.doc(path);
  try { await ref.update(patch); } catch (e) { if (e && e.code === 'invalid_argument') await ref.set(Object.assign({}, create || {}, patch)); else throw e; }
}

const latin1 = (s) => String(s).replace(/[✅]/g, '').replace(/[⚠▲▼●◆🔴]/g, '').replace(/[^\x00-\xFF€]/g, '').trim();
function modelAOA(m, forPdf) {
  const cols = m.colunas.filter((c) => !c.noexp && !c.acts);
  const head = cols.map((c) => c.t);
  const body = m.linhas.map((l) => cols.map((c) => {
    let v = c.xf ? c.xf(l) : l[c.k];
    if (v && typeof v === 'object' && 'err' in v) return v.err;
    if (v === null || v === undefined) return '';
    if (forPdf) { const k = c.fmt || (l.k && l.k.fmt) || null; return latin1(typeof v === 'number' ? fmt(v, k || 'x') : v); }
    return typeof v === 'string' ? v.replace(/^[✅⚠]\s?/, '') : v;
  }));
  return { head, body };
}
async function saveFile(filename, data) {
  if (!S.dl) { toast('Exportação indisponível nesta visualização.'); return; }

const slug = (s) => latin1(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '').slice(0, 60);
async function exportModel(id, f) {

    const cell = (v) => { const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

    ws['!cols'] = head.map((h, i) => ({ wch: Math.min(48, Math.max(10, h.length + 2, ...body.map((r) => String(r[i] === undefined ? '' : r[i]).length + 1))) }));

    doc.setFontSize(10); doc.setTextColor(90, 96, 115); doc.text(latin1(`${m.sub || ''} · gerado em ${new Date().toLocaleString('pt-BR')}`), 36, 100);
    doc.autoTable({ head: [head], body, startY: 112, margin: { left: 36, right: 36 }, styles: { fontSize: 8, cellPadding: 4, textColor: [15, 42, 74] }, headStyles: { fillColor: [15, 76, 156], textColor: [255, 255, 255] }, alternateRowStyles: { fillColor: [238, 244, 252] },

}

      try { html += (map[S.route.page] || pageInicio)(); } catch (e) { console.error(e); html += emptyState('Erro ao montar esta tela', esc(e.message)); }
      if (S.dbState === 'ok' && !Object.keys(D.planilhas).length && pg === 'painel') html += `<div class="section">${emptyState('Nenhum lançamento ainda', 'Abra um departamento e use "+ Novo lançamento" para registrar o primeiro dado.')}</div>`;
    }
  }
  const y = window.scrollY; main.innerHTML = html; window.scrollTo(0, y);
  mountCharts();
}
function go(page, dep, tab, comp) {
  S.route = { page, dep: dep || null, tab: tab || null };
  if (page === 'historico' && S.ui.hist) S.ui.hist.key = '';
  if (comp && tab && SHEET_BY_TAB[tab]) S.ui.comp[SHEET_BY_TAB[tab]] = comp;
  const tokn = page === 'dep' ? dep + (tab ? '-' + tab : '') : page;
  try { history.replaceState(null, '', '#' + tokn); } catch (e) { /* ignore */ }
  $('.app').classList.remove('nav-open');
  try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) { /* */ }
  S.pendingRender = false; window.scrollTo(0, 0); render();
}
function fromHash() {
  const h = (location.hash || '').slice(1); if (!h) return;
  const [a, b] = h.split('-');
  if (DEPS[a]) S.route = { page: 'dep', dep: a, tab: b || null };
  else if (['inicio', 'painel', 'comparativos', 'alertas', 'metas', 'relatorios', 'historico', 'usuarios', 'config', 'validacao'].includes(a)) S.route = { page: a };
}

// ---------- eventos ----------
document.addEventListener('click', (ev) => {
  const app = $('.app');
  if (app && app.classList.contains('nav-open') && !ev.target.closest('.side') && !ev.target.closest('[data-act="menu"]')) { app.classList.remove('nav-open'); return; }
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (t.tagName === 'A') ev.preventDefault();
  switch (a) {
    case 'nav': go(t.dataset.page, t.dataset.dep, t.dataset.tab); break;
    case 'go': { const g = JSON.parse(t.dataset.go); go(g.page, g.dep, g.tab, g.comp); break; }
    case 'tab': S.route.tab = t.dataset.tab; try { history.replaceState(null, '', '#' + S.route.dep + '-' + t.dataset.tab); } catch (e) { /* */ } render(); break;
    case 'painel-tab': S.ui.perPainelTab = t.dataset.tab; render(); break;
    case 'per-tipo': { const st = S.ui[t.dataset.key]; st.tipo = t.dataset.tipo; if (st.tipo === 'custom' && !st.fim) st.fim = mkPeriod('mes', st.ref).fim; render(); break; }
    case 'comp-step': { const k = t.dataset.key; S.ui.comp[k] = addMonths(S.ui.comp[k], +t.dataset.n); render(); break; }
    case 'ano-step': { const k = t.dataset.key; S.ui.ano[k] = String(+S.ui.ano[k] + +t.dataset.n); render(); break; }
    case 'dia-step': S.ui.dia = addDays(S.ui.dia, +t.dataset.n); render(); break;
    case 'mes-step': S.ui.mes = addMonths(S.ui.mes, +t.dataset.n); render(); break;
    case 'cmp-tipo': { const c = S.ui.cmp; c.tipo = t.dataset.tipo; if (c.tipo === 'ano') { c.a = c.a.slice(0, 4) + '-01-01'; c.b = String(+c.a.slice(0, 4) - 1) + '-01-01'; } render(); break; }
    case 'val-dep': S.ui.valDep = t.dataset.dep; render(); break;
    case 'new': openForm(t.dataset.sheet, t.dataset.comp); break;
    case 'edit': openForm(t.dataset.sheet, t.dataset.comp, t.dataset.id); break;
    case 'close': closeModal(); break;
    case 'del': deleteRow(); break;
    case 'exp': exportModel(t.dataset.id, t.dataset.f); break;
    case 'backup': backup(t.dataset.f); break;
    case 'save-listas': saveListas(t.dataset.dep); break;
    case 'save-itens': saveItens(); break;
    case 'save-metas': saveMetas(); break;
    case 'save-papeis': savePapeis(); break;
    case 'menu': $('.app').classList.toggle('nav-open'); break;
    default: if (EXT_ACTS[a]) EXT_ACTS[a](t);
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target; const ds = el.dataset || {};
  if (ds.chg) { inlineChange(el); return; }
  if (ds.per) { const st = S.ui[ds.per]; if (ds.f === 'ano') st.ref = `${el.value}-01-01`; else if (ds.f === 'fim') st.fim = el.value; else st.ref = el.value.length === 7 ? el.value + '-01' : el.value; if (el.value) render(); return; }
  if (ds.comp) { if (el.value) { S.ui.comp[ds.comp] = el.value; render(); } return; }
  if (ds.ano !== undefined && el.id.startsWith('ano-')) { S.ui.ano[el.id.slice(4)] = el.value; render(); return; }
  if (ds.dia) { if (el.value) { S.ui.dia = el.value; render(); } return; }
  if (ds.mes) { if (el.value) { S.ui.mes = el.value; render(); } return; }
  if (ds.messerie) { S.ui.mesSerie = el.value; render(); return; }
  if (ds.cmp) { const c = S.ui.cmp; const v = ds.ano ? `${el.value}-01-01` : el.value.length === 7 ? el.value + '-01' : el.value; c[ds.cmp] = v; render(); return; }
  if (ds.cmpdep) { S.ui.cmp.dep = el.value; render(); return; }
  if (ds.cmpind) { S.ui.cmp.ind = el.value; render(); return; }
  if (ds.cmpano) { S.ui.cmp[ds.cmpano] = el.value; render(); return; }
  if (ds.aldep) { S.ui.alertDep = el.value; render(); return; }
  if (ds.alsev) { S.ui.alertSev = el.value; render(); return; }
  if (ds.rel) { S.ui.rel[ds.rel] = el.value; render(); return; }
  if (ds.aud) { S.ui.hist[ds.aud] = el.value; render(); return; }
});
document.addEventListener('input', (ev) => { if (FORM && ev.target.closest('#fm')) updateCalcBox(); });
document.addEventListener('submit', (ev) => { if (ev.target.id === 'fm') { ev.preventDefault(); submitForm(); } });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && FORM) closeModal(); });
document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRender && !FORM) { const ae = document.activeElement; if (!ae || !ae.closest || !ae.closest('#main') || !/INPUT|SELECT|TEXTAREA/.test(ae.tagName)) render(); } }, 50); });
window.addEventListener('hashchange', () => { fromHash(); render(); });

// ---------- inicialização ----------
async function boot() {
  fromHash(); render();
  const cl = window.claude;
  if (!cl || !cl.use) { S.dbState = 'offline'; S.route.page = 'validacao'; render(); return; }
  const [db, user, dl] = await Promise.all([cl.use('db').catch(() => null), cl.use('user').catch(() => null), cl.use('downloads').catch(() => null)]);
  S.db = db; S.user = user; S.dl = dl;
  if (user) { try { const me = await user.me(); S.uid = me.id; S.isOwner = !!me.isOwner; S.profiles[me.id || '_'] = me; } catch (e) { /* */ } try { S.canWrite = await user.can('data.write'); } catch (e) { S.canWrite = null; } }
  if (!db) { S.dbState = 'offline'; S.route.page = ['painel', 'inicio'].includes(S.route.page) ? 'validacao' : S.route.page; render(); return; }
  let pending = 4; const done = () => { if (--pending === 0) { S.dbState = 'ok'; render(); } };
  const sub = (col, key, isDoc) => {
    let first = true;
    db.collection(col).onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { if (d.exists) o[d.id] = d.data(); }); D[key] = o;
      if (first) { first = false; done(); } else schedule();
    }, (e) => { console.warn('db', col, e); if (first) { first = false; done(); } });
  };
  sub('planilhas', 'planilhas'); sub('mensal', 'mensal'); sub('cadastros', 'cadastros'); sub('config', 'config');
  if (S.uid) db.collection('presenca').onSnapshot((snap) => { const o = {}; snap.docs.forEach((d) => { o[d.id] = d.data(); }); D.presenca = o; if (S.route.page === 'usuarios') schedule(); }, () => {});
  // registra o acesso (no máximo a cada 12 h) para o administrador atribuir perfis
  if (S.uid && S.canWrite !== false) {
    try { const ref = db.doc('presenca/' + S.uid); const s = await ref.get(); const u = s.exists && s.data().ultimo; if (!u || Date.now() - new Date(u).getTime() > 12 * 3600e3) await ref.set({ ultimo: new Date().toISOString() }); } catch (e) { /* opcional */ }
  }
}
let _sch = null;
function schedule() { if (_sch) return; _sch = requestAnimationFrame(() => { _sch = null; render(); }); }
boot();
